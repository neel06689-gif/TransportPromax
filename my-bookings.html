<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta

<title>My Bookings | Transport</title>

<style>

/* =========================================
   RESET
========================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f4f7fb;
    color:#111827;
    min-height:100vh;
}

button{
    font-family:inherit;
    cursor:pointer;
}


/* =========================================
   HEADER
========================================= */

.header{

    background:#07111f;

    color:white;

    padding:16px 14px;

    position:sticky;

    top:0;

    z-index:100;

}


.header-row{

    max-width:900px;

    margin:auto;

    display:flex;

    align-items:center;

    gap:10px;

}


.back-btn{

    width:40px;

    height:40px;

    border:none;

    border-radius:10px;

    background:#172335;

    color:white;

    font-size:21px;

}


.header-title{

    flex:1;

}


.header-title h1{

    font-size:19px;

    margin-bottom:4px;

}


.header-title p{

    color:#aeb9c8;

    font-size:10px;

}


.refresh-btn{

    width:40px;

    height:40px;

    border:none;

    border-radius:10px;

    background:#172335;

    color:white;

    font-size:22px;

}


/* =========================================
   MAIN CONTAINER
========================================= */

.container{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:16px 12px 40px;

}


/* =========================================
   SUMMARY CARDS
========================================= */

.summary{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

    margin-bottom:14px;

}


.summary-card{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:14px;

    padding:13px 5px;

    text-align:center;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.04);

}


.summary-icon{

    font-size:18px;

    margin-bottom:5px;

}


.summary-number{

    font-size:17px;

    font-weight:800;

}


.summary-label{

    margin-top:3px;

    color:#667085;

    font-size:9px;

}


/* =========================================
   SECTION
========================================= */

.section{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:14px;

    margin-bottom:14px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.03);

}


.section-title{

    display:flex;

    align-items:center;

    gap:7px;

    font-size:14px;

    font-weight:800;

    margin-bottom:11px;

}


/* =========================================
   FILTER BUTTONS
========================================= */

.filters{

    display:flex;

    gap:7px;

    overflow-x:auto;

    padding-bottom:2px;

}


.filters::-webkit-scrollbar{

    display:none;

}


.filterBtn{

    flex-shrink:0;

    border:1px solid #d0d5dd;

    background:white;

    color:#344054;

    border-radius:20px;

    padding:8px 14px;

    font-size:10px;

    transition:.2s;

}


.filterBtn:active{

    transform:scale(.96);

}


.filterBtn.active{

    background:#2563eb;

    border-color:#2563eb;

    color:white;

}


/* =========================================
   BOOKING LIST
========================================= */

#bookingList{

    display:grid;

    gap:12px;

}


/* =========================================
   BOOKING CARD
========================================= */

.booking-card{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:14px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.04);

}


.booking-top{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:8px;

    margin-bottom:12px;

}


.booking-id{

    color:#667085;

    font-size:8px;

}


.booking-id strong{

    display:block;

    color:#111827;

    margin-top:3px;

    font-size:11px;

}


.status{

    padding:6px 9px;

    border-radius:20px;

    font-size:8px;

    font-weight:700;

    white-space:nowrap;

}


/* =========================================
   ROUTE
========================================= */

.route-box{

    background:#f8fafc;

    border-radius:12px;

    padding:12px;

    margin-bottom:10px;

}


.route-row{

    display:flex;

    align-items:flex-start;

    gap:9px;

}


.route-icon{

    width:26px;

    height:26px;

    flex-shrink:0;

    border-radius:50%;

    background:#eff6ff;

    color:#2563eb;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:10px;

    font-weight:700;

}


.route-text{

    min-width:0;

}


.route-text small{

    display:block;

    color:#667085;

    font-size:7px;

    margin-bottom:3px;

}


.route-text strong{

    display:block;

    font-size:10px;

    word-break:break-word;

}


.route-line{

    height:15px;

    border-left:

        #cbd5e1;

    margin-left:12px;

}


/* =========================================
   DETAILS GRID
========================================= */

.details-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    margin-bottom:12px;

}


.detail{

    background:#f8fafc;

    border-radius:10px;

    padding:9px;

}


.detail small{

    display:block;

    color:#667085;

    font-size:7px;

    margin-bottom:4px;

}


.detail strong{

    display:block;

    font-size:9px;

    word-break:break-word;

}


/* =========================================
   ACTION BUTTONS
========================================= */

.booking-actions{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

}


.action-btn{

    min-height:42px;

    border-radius:10px;

    font-size:10px;

    font-weight:700;

}


.view-btn{

    border:
        1px solid
        #2563eb;

    background:white;

    color:#2563eb;

}


.track-btn{

    border:none;

    background:#07111f;

    color:white;

}


/* =========================================
   EMPTY STATE
========================================= */

.empty{

    background:white;

    border:
        1px dashed
        #cbd5e1;

    border-radius:15px;

    padding:35px 18px;

}


.empty-icon{

    font-size:36px;

    margin-bottom:10px;

}


.empty h3{

    font-size:14px;

    margin-bottom:6px;

}


.empty p{

    color:#667085;

    font-size:10px;

    line-height:1.5;

}


@media(max-width:420px){

    .summary-card{

        padding:11px 3px;

    }

    .summary-number{

        font-size:15px;

    }

    .summary-label{

        font-size:8px;

    }

}

</style>

</head>

<script>


/* =========================================
   GLOBAL VARIABLES
========================================= */

let allBookings = [];

let currentFilter = "all";


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        String(value ?? "");

    return div.innerHTML;

}


/* =========================================
   GET NESTED VALUE
========================================= */

function getValue(
    object,
    paths,
    fallback
){

    for(
        let i = 0;
        i < paths.length;
        i++
    ){

        const parts =
            paths[i].split(".");

        let value =
            object;


        for(
            let j = 0;
            j < parts.length;
            j++
        ){

            if(
                value === null ||
                value === undefined
            ){

                value = undefined;

                break;

            }


            value =
                value[parts[j]];

        }


        if(
            value !== undefined &&
            value !== null &&
            value !== ""
        ){

            return value;

        }

    }


    return fallback;

}


/* =========================================
   NORMALIZE STATUS
========================================= */

function normalizeStatus(status){

    const value =
        String(status)
        .trim()
        .toLowerCase();


    if(
        value === "accepted" ||
        value === "accept"
    ){

        return "Accepted";

    }


    if(
        value === "in transit" ||
        value === "in-transit" ||
        value === "transit" ||
        value === "ongoing"
    ){

        return "In Transit";

    }


    if(
        value === "delivered" ||
        value === "complete" ||
        value === "completed"
    ){

        return "Delivered";

    }


    if(
        value === "cancelled" ||
        value === "canceled"
    ){

        return "Cancelled";

    }


    return "Pending";

}


/* =========================================
   NORMALIZE BOOKING
========================================= */

function normalizeBooking(raw){

    const booking =
        raw || {};


    return {

        raw: booking,


        requestId:
            getValue(
                booking,
                [
                    "requestId",
                    "requestID",
                    "bookingId",
                    "bookingID",
                    "booking_id",
                    "id"
                ],
                "BOOKING-" +
                Date.now()
            ),


        status:
            normalizeStatus(
                getValue(
                    booking,
                    [
                        "status",
                        "bookingStatus",
                        "booking_status"
                    ],
                    "Pending"
                )
            ),


        truckName:
            getValue(
                booking,
                [
                    "truck.name",
                    "truckName",
                    "vehicle.name",
                    "vehicleName",
                    "truckType"
                ],
                "Transport Truck"
            ),


        truckNumber:
            getValue(
                booking,
                [
                    "truck.number",
                    "truckNumber",
                    "vehicle.number",
                    "vehicleNumber",
                    "registrationNumber"
                ],
                "—"
            ),


        pickup:
            getValue(
                booking,
                [
                    "route.pickup",
                    "pickup",
                    "pickupLocation",
                    "pickup_location",
                    "from",
                    "source"
                ],
                "—"
            ),


        destination:
            getValue(
                booking,
                [
                    "route.destination",
                    "destination",
                    "dropLocation",
                    "drop_location",
                    "to",
                    "drop"
                ],
                "—"
            ),


        goodsType:
            getValue(
                booking,
                [
                    "goods.type",
                    "goodsType",
                    "goods_type",
                    "goodsName",
                    "goods"
                ],
                "—"
            ),


        weight:
            getValue(
                booking,
                [
                    "goods.weight",
                    "weight",
                    "loadWeight"
                ],
                "—"
            ),


        unit:
            getValue(
                booking,
                [
                    "goods.unit",
                    "weightUnit",
                    "unit"
                ],
                ""
            ),


        pickupDate:
            getValue(
                booking,
                [
                    "schedule.date",
                    "pickupDate",
                    "pickup_date",
                    "date"
                ],
                "—"
            ),


        pickupTime:
            getValue(
                booking,
                [
                    "schedule.time",
                    "pickupTime",
                    "pickup_time",
                    "time"
                ],
                "—"
            ),


        freight:
            getValue(
                booking,
                [
                    "freight",
                    "price",
                    "amount",
                    "fare",
                    "totalAmount"
                ],
                ""
            ),


        customerName:
            getValue(
                booking,
                [
                    "customer.name",
                    "customerName",
                    "name"
                ],
                "—"
            ),


        customerPhone:
            getValue(
                booking,
                [
                    "customer.phone",
                    "customerPhone",
                    "phone"
                ],
                "—"
            )

    };

}


/* =========================================
   ADD BOOKING
========================================= */

function addBooking(raw){

    if(
        !raw ||
        typeof raw !== "object"
    ){

        return;

    }


    const booking =
        normalizeBooking(raw);


    const exists =
        allBookings.some(
            function(item){

                return String(
                    item.requestId
                ) === String(
                    booking.requestId
                );

            }
        );


    if(!exists){

        allBookings.push(
            booking
        );

    }

}


/* =========================================
   LOAD BOOKINGS
========================================= */

function loadBookings(){

    allBookings = [];


    const storageKeys = [

        "myBookings",

        "truckBookingRequest",

        "bookingData",

        "currentBooking",

        "bookings",

        "transportBookings"

    ];


    storageKeys.forEach(
        function(key){

            const saved =
                localStorage.getItem(key);


            if(!saved){

                return;

            }


            try{

                const parsed =
                    JSON.parse(saved);


                if(
                    Array.isArray(parsed)
                ){

                    parsed.forEach(
                        function(item){

                            addBooking(item);

                        }
                    );

                }
                else if(
                    parsed &&
                    typeof parsed === "object"
                ){

                    addBooking(parsed);

                }

            }
            catch(error){

                console.log(
                    "Storage error:",
                    key,
                    error
                );

            }

        }
    );


    updateSummary();

    renderBookings();

}


/* =========================================
   UPDATE SUMMARY
========================================= */

function updateSummary(){

    const total =
        allBookings.length;


    const pending =
        allBookings.filter(
            function(item){

                return (
                    item.status ===
                    "Pending"
                );

            }
        ).length;


    const active =
        allBookings.filter(
            function(item){

                return (
                    item.status ===
                    "Accepted" ||

                    item.status ===
                    "In Transit"
                );

            }
        ).length;


    const completed =
        allBookings.filter(
            function(item){

                return (
                    item.status ===
                    "Delivered"
                );

            }
        ).length;


    const totalElement =
        document.getElementById(
            "totalBookings"
        );


    const pendingElement =
        document.getElementById(
            "pendingBookings"
        );


    const activeElement =
        document.getElementById(
            "activeBookings"
        );


    const completedElement =
        document.getElementById(
            "completedBookings"
        );


    if(totalElement){

        totalElement.textContent =
            total;

    }


    if(pendingElement){

        pendingElement.textContent =
            pending;

    }


    if(activeElement){

        activeElement.textContent =
            active;

    }


    if(completedElement){

        completedElement.textContent =
            completed;

    }

}


/* =========================================
   FILTER BOOKINGS
========================================= */

function filterBookings(filter){

    currentFilter =
        filter;


    document
    .querySelectorAll(
        ".filterBtn"
    )
    .forEach(
        function(button){

            button.classList.remove(
                "active"
            );

        }
    );


    const selected =
        document.querySelector(
            '[data-filter="' +
            filter +
            '"]'
        );


    if(selected){

        selected.classList.add(
            "active"
        );

    }


    renderBookings();

}


/* =========================================
   RENDER BOOKINGS
========================================= */

function renderBookings(){

    const list =
        document.getElementById(
            "bookingList"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );


    if(!list){

        return;

    }


    list.innerHTML = "";


    let filtered =
        allBookings;


    if(
        currentFilter !== "all"
    ){

        filtered =
            allBookings.filter(
                function(booking){

                    return (
                        booking.status
                        .toLowerCase()
                        ===
                        currentFilter
                        .toLowerCase()
                    );

                }
            );

    }


    if(
        filtered.length === 0
    ){

        if(empty){

            empty.style.display =
                "block";

        }

        return;

    }


    if(empty){

        empty.style.display =
            "none";

    }


    filtered.forEach(
        function(booking){

            list.appendChild(
                createBookingCard(
                    booking
                )
            );

        }
    );

}


/* =========================================
   CREATE BOOKING CARD
========================================= */

/* =========================================
   CREATE BOOKING CARD
========================================= */

function createBookingCard(booking){

    const card =
        document.createElement("div");

    card.className =
        "booking-card";


    const freight =
        booking.freight
        ? "₹" +
          Number(
              booking.freight

/* =========================================
   TRACKING
========================================= */

function showTracking(
    booking
){

    const modal =
        document.getElementById(
            "trackingModal"
        );


    const content =
        document.getElementById(
            "trackingContent"
        );


    if(!modal || !content){

        return;

    }


    const steps = [

        "Request Sent",

        "Transporter Accepted",

        "Truck In Transit",

        "Delivered"

    ];


    const positions = {

        "Pending":0,

        "Accepted":1,

        "In Transit":2,

        "Delivered":3

    };


    const activeIndex =
        positions[
            booking.status
        ] ?? 0;


    let html = `

        <div class="tracking-id">

            Request ID:

            <strong>
                ${escapeHTML(
                    booking.requestId
                )}
            </strong>

            <br><br>

            Current Status:

            <strong>
                ${escapeHTML(
                    booking.status
                )}
            </strong>

        </div>

    `;


    steps.forEach(
        function(step,index){

            const completed =
                index <= activeIndex;


            html += `

                <div class="track-step">


                    <div class="
                        track-circle
                        ${
                            completed
                            ? "done"
                            : "waiting"
                        }
                    ">

                        ${
                            completed
                            ? "✓"
                            : index + 1
                        }

                    </div>


                    <div class="track-info">

                        <strong>
                            ${step}
                        </strong>

                        <span>

                            ${
                                completed
                                ? (
                                    index === activeIndex
                                    ? "Current status"
                                    : "Completed"
                                )
                                : "Waiting"
                            }

                        </span>

                    </div>


                </div>


                ${
                    index <
                    steps.length - 1

                    ? `

                        <div class="
                            track-connector
                            ${
                                index <
                                activeIndex
                                ? "done"
                                : "waiting"
                            }
                        ">
                        </div>

                    `

                    : ""
                }

            `;

        }
    );


    html += `

        <div class="gps-note">

            📍

            <strong>
                Live GPS Tracking
            </strong>

            <br>

            Real-time truck location
            backend और GPS connection
            के बाद यहाँ दिखाई जाएगी।

        </div>

    `;


    content.innerHTML =
        html;


    modal.style.display =
        "flex";

}

/* =========================================
   UPDATE BOOKING STATUS
========================================= */

function updateBookingStatus(
    requestId,
    newStatus
){

    let changed = false;


    const storageKeys = [

        "myBookings",
        "truckBookingRequest",
        "bookingData",
        "currentBooking",
        "bookings",
        "transportBookings"

    ];


    storageKeys.forEach(
        function(key){

            const saved =
                localStorage.getItem(key);


            if(!saved){

                return;

            }


            try{

                const data =
                    JSON.parse(saved);


                if(Array.isArray(data)){

                    data.forEach(
                        function(item){

                            const id =
                                getValue(
                                    item,
                                    [
                                        "requestId",
                                        "requestID",
                                        "bookingId",
                                        "bookingID",
                                        "booking_id",
                                        "id"
                                    ],
                                    ""
                                );


                            if(
                                String(id) ===
                                String(requestId)
                            ){

                                item.status =
                                    newStatus;

                                changed = true;

                            }

                        }
                    );


                    if(changed){

                        localStorage.setItem(
                            key,
                            JSON.stringify(data)
                        );

                    }

                }
                else if(
                    data &&
                    typeof data === "object"
                ){

                    const id =
                        getValue(
                            data,
                            [
                                "requestId",
                                "requestID",
                                "bookingId",
                                "bookingID",
                                "booking_id",
                                "id"
                            ],
                            ""
                        );


                    if(
                        String(id) ===
                        String(requestId)
                    ){

                        data.status =
                            newStatus;

                        localStorage.setItem(
                            key,
                            JSON.stringify(data)
                        );

                        changed = true;

                    }

                }

            }
            catch(error){

                console.log(
                    "Status update error:",
                    error
                );

            }

        }
    );


    if(changed){

        loadBookings();

    }

}



/* =========================================
   SAVE BOOKING
========================================= */

function saveNewBooking(
    booking
){

    if(
        !booking ||
        typeof booking !== "object"
    ){

        return false;

    }


    let bookings = [];


    const saved =
        localStorage.getItem(
            "myBookings"
        );


    if(saved){

        try{

            const parsed =
                JSON.parse(saved);


            if(
                Array.isArray(parsed)
            ){

                bookings =
                    parsed;

            }
            else if(
                parsed &&
                typeof parsed === "object"
            ){

                bookings = [
                    parsed
                ];

            }

        }
        catch(error){

            bookings = [];

        }

    }


    if(
        !booking.requestId
    ){

        booking.requestId =
            "BK-" +
            Date.now();

    }


    if(
        !booking.status
    ){

        booking.status =
            "Pending";

    }


    bookings.push(
        booking
    );


    try{

        localStorage.setItem(
            "myBookings",
            JSON.stringify(
                bookings
            )
        );


        loadBookings();

        return true;

    }
    catch(error){

        console.log(
            "Save booking error:",
            error
        );

        return false;

    }

}



/* =========================================
   DELETE BOOKING
========================================= */

function deleteBooking(
    requestId
){

    const confirmDelete =
        confirm(
            "क्या आप यह booking delete करना चाहते हैं?"
        );


    if(!confirmDelete){

        return;

    }


    const saved =
        localStorage.getItem(
            "myBookings"
        );


    if(!saved){

        return;

    }


    try{

        let bookings =
            JSON.parse(saved);


        if(!Array.isArray(bookings)){

            bookings = [
                bookings
            ];

        }


        bookings =
            bookings.filter(
                function(item){

                    const id =
                        getValue(
                            item,
                            [
                                "requestId",
                                "requestID",
                                "bookingId",
                                "bookingID",
                                "booking_id",
                                "id"
                            ],
                            ""
                        );


                    return String(id) !==
                        String(requestId);

                }
            );


        localStorage.setItem(
            "myBookings",
            JSON.stringify(
                bookings
            )
        );


        loadBookings();

    }
    catch(error){

        console.log(
            "Delete error:",
            error
        );

    }

}



/* =========================================
   SEARCH BOOKINGS
========================================= */

function searchBookings(
    searchText
){

    const text =
        String(
            searchText || ""
        )
        .trim()
        .toLowerCase();


    const list =
        document.getElementById(
            "bookingList"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );


    if(!list){

        return;

    }


    list.innerHTML = "";


    let results =
        allBookings;


    if(text){

        results =
            allBookings.filter(
                function(booking){

                    const searchable = (

                        booking.requestId +
                        " " +
                        booking.pickup +
                        " " +
                        booking.destination +
                        " " +
                        booking.goodsType +
                        " " +
                        booking.truckName +
                        " " +
                        booking.truckNumber +
                        " " +
                        booking.status

                    ).toLowerCase();


                    return searchable
                        .includes(text);

                }
            );

    }


    if(
        currentFilter !== "all"
    ){

        results =
            results.filter(
                function(booking){

                    return (
                        booking.status
                        .toLowerCase()
                        ===
                        currentFilter
                        .toLowerCase()
                    );

                }
            );

    }


    if(
        results.length === 0
    ){

        if(empty){

            empty.style.display =
                "block";

        }

        return;

    }


    if(empty){

        empty.style.display =
            "none";

    }


    results.forEach(
        function(booking){

            list.appendChild(
                createBookingCard(
                    booking
                )
            );

        }
    );

}



/* =========================================
   FORMAT CURRENCY
========================================= */

function formatCurrency(
    amount
){

    if(
        amount === "" ||
        amount === null ||
        amount === undefined
    ){

        return "Negotiable";

    }


    const number =
        Number(amount);


    if(
        Number.isNaN(number)
    ){

        return String(amount);

    }


    return "₹" +
        number.toLocaleString(
            "en-IN"
        );

}



/* =========================================
   FORMAT DATE
========================================= */

function formatDate(
    value
){

    if(
        !value ||
        value === "—"
    ){

        return "—";

    }


    const text =
        String(value);


    const date =
        new Date(
            text.includes("T")
            ? text
            : text + "T00:00:00"
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return text;

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}
