<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Repair Work</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#07111f;
    color:white;
    padding-bottom:40px;
}

header{
    padding:18px;
    background:#0d1b2d;
    border-bottom:1px solid #24364d;
}

header h2{
    font-size:20px;
}

.container{
    padding:15px;
}

.card{
    background:#101f32;
    border:1px solid #263c55;
    border-radius:15px;
    padding:17px;
    margin-bottom:15px;
}

.id{
    color:#8fa7c1;
    font-size:12px;
    margin-bottom:10px;
}

.problem{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.info{
    color:#c4d0dd;
    font-size:14px;
    line-height:1.7;
}

.status{
    margin-top:14px;
    padding:10px;
    border-radius:10px;
    background:#172b42;
    text-align:center;
    font-weight:bold;
}

.stepBox{
    margin-top:18px;
}

.step{
    display:flex;
    align-items:center;
    gap:10px;
    margin:13px 0;
    color:#71849a;
}

.dot{
    width:15px;
    height:15px;
    border-radius:50%;
    background:#394b60;
}

.step.active{
    color:#fff;
    font-weight:bold;
}

.step.active .dot{
    background:#18d47b;
    box-shadow:0 0 10px #18d47b;
}

button{
    width:100%;
    border:0;
    padding:14px;
    margin-top:15px;
    border-radius:10px;
    background:#18d47b;
    color:#06130c;
    font-size:15px;
    font-weight:bold;
}

button:disabled{
    background:#34475c;
    color:#91a0af;
}

.empty{
    text-align:center;
    padding:50px 15px;
    color:#8fa1b5;
}

.back{
    display:inline-block;
    margin-top:8px;
    color:#18d47b;
    text-decoration:none;
}

</style>
</head>

<body>

<header>

<h2>🔧 My Repair Work</h2>

<a class="back" href="mechanic.html">
← Back to Mechanic Community
</a>

</header>


<div class="container">

<div id="workList"></div>

</div>


<script>

function getRequests(){

    return JSON.parse(
        localStorage.getItem("truckRepairRequests") || "[]"
    );

}


function getMechanic(){

    return JSON.parse(
        localStorage.getItem("mechanicProfile") || "{}"
    );

}


function getStatusIndex(status){

    const steps = [
        "Accepted",
        "On the Way",
        "Arrived",
        "Repairing",
        "Completed"
    ];

    return steps.indexOf(status);

}


function updateWork(requestId){

    let requests = getRequests();

    const index = requests.findIndex(
        r => r.id === requestId
    );

    if(index === -1) return;

    const current = requests[index].workStatus || "Accepted";

    const steps = [
        "Accepted",
        "On the Way",
        "Arrived",
        "Repairing",
        "Completed"
    ];

    let currentIndex = steps.indexOf(current);

    if(currentIndex < steps.length - 1){

        requests[index].workStatus =
            steps[currentIndex + 1];

        requests[index].lastUpdated =
            new Date().toISOString();

        localStorage.setItem(
            "truckRepairRequests",
            JSON.stringify(requests)
        );

        renderWorks();
    }

}


function renderWorks(){

    const box = document.getElementById("workList");

    const mechanic = getMechanic();

    const mechanicName =
        mechanic.name || "Mechanic";

    const requests = getRequests();

    const myWorks = requests.filter(r =>
        r.status === "Accepted" &&
        r.acceptedBy === mechanicName
    );


    if(myWorks.length === 0){

        box.innerHTML = `
        <div class="empty">

            <div style="font-size:45px;">🔧</div>

            <h3>No accepted work</h3>

            <p style="margin-top:10px;">
            Jab aap koi repair request accept karenge,
            wo yahan दिखाई देगी.
            </p>

        </div>
        `;

        return;
    }


    box.innerHTML = myWorks.map(request => {

        const status =
            request.workStatus || "Accepted";

        const statusIndex =
            getStatusIndex(status);


        const steps = [
            "Accepted",
            "On the Way",
            "Arrived",
            "Repairing",
            "Completed"
        ];


        const stepHTML = steps.map(
            (step,index) => `

            <div class="step ${
                index <= statusIndex ? "active" : ""
            }">

                <div class="dot"></div>

                <span>${step}</span>

            </div>

            `
        ).join("");


        const isCompleted =
            status === "Completed";


        return `

        <div class="card">

            <div class="id">
                Request ID: ${request.id}
            </div>

            <div class="problem">
                🔧 ${request.problem}
            </div>

            <div class="info">

                🚛 Vehicle:
                ${request.vehicleNumber || "N/A"}

                <br>

                📍 Location:
                ${request.location || "N/A"}

                <br>

                ⚠️ Urgency:
                ${request.urgency || "Normal"}

                <br>

                👤 Customer:
                ${request.ownerName || "Truck Owner"}

            </div>


            <div class="status">

                Current Status:
                ${status}

            </div>


            <div class="stepBox">

                ${stepHTML}

            </div>


            ${
                isCompleted

                ?

                `<button disabled>
                    ✅ Work Completed
                </button>`

                :

                `<button
                    onclick="updateWork('${request.id}')">

                    ${
                        status === "Accepted"
                        ? "🚗 Start Journey"
                        : status === "On the Way"
                        ? "📍 Mark Arrived"
                        : status === "Arrived"
                        ? "🔧 Start Repair"
                        : "✅ Mark Completed"
                    }

                </button>`
            }

        </div>

        `;

    }).join("");

}


renderWorks();

setInterval(renderWorks,3000);

</script>

</body>
</html>
