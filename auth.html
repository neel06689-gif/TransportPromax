<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TransportPro Global - Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#07111f;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

.logo h1{
    font-size:25px;
}

.logo p{
    color:#aeb9ca;
    font-size:13px;
    margin-top:5px;
}

.card{
    background:white;
    border-radius:20px;
    padding:22px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    border:0;
    padding:12px;
    border-radius:10px;
    background:#eef2f7;
    font-weight:bold;
}

.tab.active{
    background:#1677ff;
    color:white;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

h2{
    margin-bottom:15px;
}

label{
    display:block;
    margin:12px 0 6px;
    font-size:13px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #d7deea;
    border-radius:10px;
    font-size:14px;
    outline:none;
}

button.main{
    width:100%;
    border:0;
    padding:14px;
    margin-top:18px;
    border-radius:10px;
    background:#1677ff;
    color:white;
    font-size:15px;
    font-weight:bold;
}

.message{
    display:none;
    padding:12px;
    margin-bottom:14px;
    border-radius:10px;
    font-size:13px;
}

.message.show{
    display:block;
}

.success{
    background:#e8f8ee;
    color:#137333;
}

.error{
    background:#fdecec;
    color:#b42318;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
    <h1>🚛 TransportPro Global</h1>
    <p>Transport & Logistics Marketplace</p>
</div>

<div class="card">

<div id="message" class="message"></div>

<div class="tabs">

<button
    id="loginTab"
    class="tab active"
    onclick="showLogin()">
    Login
</button>

<button
    id="registerTab"
    class="tab"
    onclick="showRegister()">
    Register
</button>

</div>


<!-- LOGIN -->

<div id="loginForm" class="form active">

<h2>Welcome Back</h2>

<label>Email</label>

<input
    type="email"
    id="loginEmail"
    placeholder="Enter email">

<label>Password</label>

<input
    type="password"
    id="loginPassword"
    placeholder="Enter password">

<button
    class="main"
    id="loginButton"
    onclick="loginUser()">
    Login
</button>

</div>


<!-- REGISTER -->

<div id="registerForm" class="form">

<h2>Create Account</h2>

<label>Full Name</label>

<input
    type="text"
    id="registerName"
    placeholder="Your full name">

<label>Mobile Number</label>

<input
    type="tel"
    id="registerPhone"
    maxlength="10"
    placeholder="10 digit mobile number">

<label>Email</label>

<input
    type="email"
    id="registerEmail"
    placeholder="example@gmail.com">

<label>Password</label>

<input
    type="password"
    id="registerPassword"
    placeholder="Minimum 6 characters">

<label>Select Role</label>

<select id="registerRole">

<option value="">
Select Role
</option>

<option value="driver">
🚛 Driver
</option>

<option value="mechanic">
🔧 Mechanic
</option>

<option value="dealer">
📦 Dealer
</option>

<option value="transporter">
🏢 Transporter
</option>

<option value="fleet_owner">
🚚 Fleet Owner
</option>

<option value="customer">
👤 Customer / Goods Owner
</option>

</select>

<button
    class="main"
    id="registerButton"
    onclick="registerUser()">

    Create Account

</button>

</div>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"cohhrmnyjrjyymgtymkr";

const SUPABASE_ANON_KEY =
"sb_publishable_b8lurBDOeF6P5EQr2tmBbg_4CFiXOiA";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message show " + type;
}


/* ==========================================
   LOGIN TAB
========================================== */

function showLogin(){

    document
    .getElementById("loginForm")
    .classList.add("active");

    document
    .getElementById("registerForm")
    .classList.remove("active");

    document
    .getElementById("loginTab")
    .classList.add("active");

    document
    .getElementById("registerTab")
    .classList.remove("active");

}


/* ==========================================
   REGISTER TAB
========================================== */

function showRegister(){

    document
    .getElementById("registerForm")
    .classList.add("active");

    document
    .getElementById("loginForm")
    .classList.remove("active");

    document
    .getElementById("registerTab")
    .classList.add("active");

    document
    .getElementById("loginTab")
    .classList.remove("active");

}


/* ==========================================
   REGISTER
========================================== */

async function registerUser(){

    const name =
        document
        .getElementById("registerName")
        .value
        .trim();

    const phone =
        document
        .getElementById("registerPhone")
        .value
        .trim();

    const email =
        document
        .getElementById("registerEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("registerPassword")
        .value;

    const role =
        document
        .getElementById("registerRole")
        .value;


    if(
        !name ||
        !phone ||
        !email ||
        !password ||
        !role
    ){

        showMessage(
            "Please fill all fields.",
            "error"
        );

        return;
    }


    if(!/^[0-9]{10}$/.test(phone)){

        showMessage(
            "Enter valid 10 digit mobile number.",
            "error"
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "registerButton"
        );

    button.disabled = true;

    button.textContent =
        "Creating Account...";


    try{

        const {data,error} =
            await supabaseClient.auth.signUp({

                email:email,

                password:password,

                options:{
                    data:{
                        full_name:name,
                        phone:phone,
                        role:role
                    }
                }

            });


        if(error){

            throw error;

        }


        showMessage(
            "✅ Registration successful. Now login.",
            "success"
        );


        document
        .getElementById("registerName")
        .value = "";

        document
        .getElementById("registerPhone")
        .value = "";

        document
        .getElementById("registerEmail")
        .value = "";

        document
        .getElementById("registerPassword")
        .value = "";

        document
        .getElementById("registerRole")
        .value = "";


        showLogin();


    }catch(error){

        showMessage(
            "❌ " + error.message,
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "Create Account";

}


/* ==========================================
   LOGIN
========================================== */

async function loginUser(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;


    if(!email || !password){

        showMessage(
            "Enter email and password.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "loginButton"
        );

    button.disabled = true;

    button.textContent =
        "Logging in...";


    try{

        const {data,error} =
            await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            throw error;

        }


        const user =
            data.user;


        /* GET PROFILE */

        const {data:profile,error:profileError} =
            await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id",user.id)
            .single();


        if(profileError){

            throw profileError;

        }


        /* BLOCKED USER */

        if(profile.account_status === "blocked"){

            await supabaseClient.auth.signOut();

            throw new Error(
                "Your account is blocked by Admin."
            );

        }


        /* UPDATE LOGIN */

        const now =
            new Date().toISOString();


        await supabaseClient
        .from("profiles")
        .update({

            last_login:now,

            last_seen:now

        })
        .eq("id",user.id);


        /* SAVE ROLE */

        localStorage.setItem(
            "tp_user_role",
            profile.role
        );

        localStorage.setItem(
            "tp_user_name",
            profile.full_name
        );


        showMessage(
            "✅ Login successful.",
            "success"
        );


        /* REDIRECT */

        setTimeout(function(){

            if(profile.role === "admin"){

                window.location.href =
                    "admin-users.html";

            }

            else if(profile.role === "driver"){

                window.location.href =
                    "driver-dashboard.html";

            }

            else if(profile.role === "mechanic"){

                window.location.href =
                    "mechanic-dashboard.html";

            }

            else if(profile.role === "dealer"){

                window.location.href =
                    "dealer-dashboard.html";

            }

            else if(profile.role === "transporter"){

                window.location.href =
                    "transporter-dashboard.html";

            }

            else if(profile.role === "fleet_owner"){

                window.location.href =
                    "fleet-dashboard.html";

            }

            else{

                window.location.href =
                    "home.html";

            }

        },700);


    }catch(error){

        console.error(error);

        showMessage(
            "❌ Login failed: " +
            error.message,
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "Login";

}

</script>

</body>
</html>
