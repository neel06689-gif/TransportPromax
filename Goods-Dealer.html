<!-- 3. GOODS DEALER -->

<button
    type="button"
    class="role-card"
    data-role="goodsDealer"
>

    <div class="role-icon">
        📦
    </div>

    <div class="role-info">

        <h3>Goods Dealer</h3>

        <p>
            Load post karein aur transporters se connect karein.
        </p>

    </div>

    <span class="role-arrow">
        →
    </span>

</button>
