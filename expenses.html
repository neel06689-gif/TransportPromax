<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Expenses - TransportPro</title>

<style>

/* =====================================
   RESET
===================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fb;
    color:#172033;
    min-height:100vh;
}


/* =====================================
   HEADER
===================================== */

.top-header{
    width:100%;
    height:62px;
    background:#101820;
    color:#fff;

    display:flex;
    align-items:center;
    gap:12px;

    padding:0 14px;

    position:sticky;
    top:0;
    z-index:100;
}

.back-btn,
.notification-btn{
    width:38px;
    height:38px;

    border:0;
    border-radius:8px;

    background:transparent;
    color:#fff;

    font-size:24px;
    cursor:pointer;
}

.back-btn:active,
.notification-btn:active{
    background:#26313d;
}

.logo{
    width:38px;
    height:38px;

    border-radius:9px;

    background:#fff;
    color:#1769e0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:15px;
    font-weight:900;
}

.brand{
    flex:1;

    display:flex;
    flex-direction:column;
}

.brand strong{
    font-size:15px;
}

.brand small{
    color:#cbd5e1;
    font-size:9px;
}


/* =====================================
   MAIN
===================================== */

.container{
    width:100%;
    max-width:850px;

    margin:auto;
    padding:15px;
}

.dashboard-btn{
    background:#fff;
    color:#172033;

    border:1px solid #dbe2ea;

    padding:10px 13px;

    border-radius:9px;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;

    margin-bottom:12px;
}

.dashboard-btn:active{
    transform:scale(.98);
}


/* =====================================
   MAIN CARD
===================================== */

.expenses-card{
    background:#fff;

    border:1px solid #e2e8f0;

    border-radius:15px;

    padding:17px;

    box-shadow:
        0 4px 15px rgba(16,24,40,.05);
}


/* =====================================
   PAGE HEADING
===================================== */

.page-heading{
    display:flex;
    align-items:center;

    gap:13px;

    padding-bottom:17px;
}

.page-icon{
    width:58px;
    height:58px;

    border-radius:14px;

    background:#fff4e8;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:31px;

    flex-shrink:0;
}

.page-heading h1{
    font-size:21px;
    margin-bottom:5px;
}

.page-heading p{
    color:#667085;

    font-size:11px;
    line-height:17px;
}


/* =====================================
   TOTAL EXPENSE
===================================== */

.total-expense-card{
    background:#1769e0;

    color:#fff;

    border-radius:12px;

    padding:18px;

    margin-bottom:12px;

    text-align:center;
}

.total-expense-card span{
    display:block;

    color:#dceaff;

    font-size:8px;

    margin-bottom:7px;
}

.total-expense-card strong{
    display:block;

    font-size:28px;

    margin-bottom:5px;
}

.total-expense-card small{
    display:block;

    color:#dceaff;

    font-size:8px;
}


/* =====================================
   FILTER
===================================== */

.filter-row{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:6px;

    margin-bottom:13px;
}

.filter-btn{
    height:34px;

    border:1px solid #dbe2ea;

    border-radius:8px;

    background:#fff;

    color:#667085;

    font-size:8px;

    font-weight:bold;

    cursor:pointer;
}

.filter-btn.active{
    background:#1769e0;

    border-color:#1769e0;

    color:#fff;
}

.filter-btn:active{
    transform:scale(.97);
}


/* =====================================
   EXPENSE SUMMARY
===================================== */

.expense-summary{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:7px;

    margin-bottom:16px;
}

.summary-box{
    background:#f8fafc;

    border:1px solid #e5eaf0;

    border-radius:9px;

    padding:11px 4px;

    text-align:center;
}

.summary-box span{
    display:block;

    color:#667085;

    font-size:7px;

    margin-bottom:5px;
}

.summary-box strong{
    display:block;

    font-size:12px;
}


/* =====================================
   ADD EXPENSE BUTTON
===================================== */

.add-expense-btn{
    width:100%;

    height:44px;

    border:0;

    border-radius:9px;

    background:#1769e0;

    color:#fff;

    font-size:10px;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:18px;
}

.add-expense-btn:active{
    transform:scale(.98);
}


/* =====================================
   SECTION HEADING
===================================== */

.section-heading{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:9px;

    border-top:1px solid #edf0f4;

    padding-top:14px;
}

.section-heading strong{
    font-size:12px;
}

.section-heading button{
    border:0;

    background:transparent;

    color:#1769e0;

    font-size:8px;

    font-weight:bold;

    cursor:pointer;
}


/* =====================================
   EXPENSE LIST
===================================== */

.expense-list{
    display:flex;

    flex-direction:column;

    gap:7px;
}


/* =====================================
   EXPENSE ITEM
===================================== */

.expense-item{
    display:flex;

    align-items:center;

    gap:9px;

    padding:10px;

    border:1px solid #e2e8f0;

    border-radius:9px;

    background:#fff;
}

.expense-icon{
    width:38px;
    height:38px;

    border-radius:8px;

    background:#fff4e8;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:17px;

    flex-shrink:0;
}

.expense-info{
    flex:1;

    min-width:0;
}

.expense-info strong{
    display:block;

    font-size:9px;

    margin-bottom:3px;
}

.expense-info small{
    display:block;

    color:#667085;

    font-size:7px;

    line-height:12px;
}

.expense-amount{
    text-align:right;
}

.expense-amount strong{
    display:block;

    color:#d92d20;

    font-size:10px;

    margin-bottom:3px;
}

.expense-amount small{
    color:#667085;

    font-size:6px;
}


/* =====================================
   EMPTY STATE
===================================== */

.empty-state{
    text-align:center;

    padding:28px 10px;

    border:1px dashed #d7dee8;

    border-radius:10px;
}

.empty-icon{
    font-size:30px;

    margin-bottom:7px;
}

.empty-state strong{
    display:block;

    font-size:11px;

    margin-bottom:4px;
}

.empty-state small{
    display:block;

    color:#667085;

    font-size:8px;

    line-height:14px;
}


/* =====================================
   MODAL
===================================== */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;

    z-index:500;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:420px;

    background:#fff;

    border-radius:14px;

    padding:17px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.2);
}

.modal-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.modal-header strong{
    font-size:15px;
}

.modal-header button{
    width:32px;
    height:32px;

    border:0;

    border-radius:7px;

    background:#f2f4f7;

    font-size:21px;

    cursor:pointer;
}


/* =====================================
   FORM
===================================== */

.modal-box label{
    display:block;

    color:#344054;

    font-size:9px;

    font-weight:bold;

    margin-bottom:5px;
}

.modal-box input,
.modal-box select{
    width:100%;

    height:43px;

    border:1px solid #d7dee8;

    border-radius:8px;

    outline:none;

    padding:0 10px;

    background:#fff;

    color:#172033;

    font-size:10px;

    margin-bottom:11px;
}

.modal-box input:focus,
.modal-box select:focus{
    border-color:#1769e0;

    box-shadow:
        0 0 0 3px rgba(23,105,224,.08);
}


/* =====================================
   MODAL BUTTONS
===================================== */

.modal-primary{
    width:100%;

    height:43px;

    border:0;

    border-radius:8px;

    background:#1769e0;

    color:#fff;

    font-size:10px;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:7px;
}

.modal-primary:active{
    transform:scale(.98);
}

.modal-secondary{
    width:100%;

    height:40px;

    border:1px solid #d7dee8;

    border-radius:8px;

    background:#fff;

    color:#344054;

    font-size:9px;

    font-weight:bold;

    cursor:pointer;
}


/* =====================================
   MOBILE
===================================== */

@media(max-width:450px){

    .container{
        padding:10px;
    }

    .expenses-card{
        padding:12px;
    }

    .page-heading{
        align-items:flex-start;
    }

    .page-icon{
        width:50px;
        height:50px;

        font-size:27px;
    }

    .page-heading h1{
        font-size:18px;
    }

    .page-heading p{
        font-size:10px;
    }

    .total-expense-card strong{
        font-size:25px;
    }

}


/* =====================================
   SMALL MOBILE
===================================== */

@media(max-width:340px){

    .expense-summary{
        grid-template-columns:
            repeat(2,1fr);
    }

    .filter-btn{
        font-size:7px;
    }

}
</style>

</head>

<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="top-header">

    <button
        class="back-btn"
        onclick="goBack()">
        ←
    </button>

    <div class="logo">
        TP
    </div>

    <div class="brand">

        <strong>
            TransportPro
        </strong>

        <small>
            Expenses
        </small>

    </div>

    <button
        class="notification-btn"
        onclick="openNotifications()">
        🔔
    </button>

</header>



<!-- =====================================
     MAIN
===================================== -->

<main class="container">


    <button
        class="dashboard-btn"
        onclick="goBack()">

        ← Back

    </button>


    <section class="expenses-card">


        <!-- PAGE HEADING -->

        <div class="page-heading">

            <div class="page-icon">
                💸
            </div>

            <div>

                <h1>
                    Expenses
                </h1>

                <p>
                    Fuel, toll, maintenance aur
                    transport ke sabhi expenses manage karein.
                </p>

            </div>

        </div>



        <!-- TOTAL EXPENSE -->

        <div class="total-expense-card">

            <span>
                Total Expenses
            </span>

            <strong id="totalExpenses">
                ₹0
            </strong>

            <small id="expensePeriod">
                This Month
            </small>

        </div>



        <!-- FILTER -->

        <div class="filter-row">

            <button
                class="filter-btn active"
                onclick="
                    changeExpensePeriod(
                        'Today',
                        this
                    )
                ">

                Today

            </button>


            <button
                class="filter-btn"
                onclick="
                    changeExpensePeriod(
                        'Week',
                        this
                    )
                ">

                Week

            </button>


            <button
                class="filter-btn"
                onclick="
                    changeExpensePeriod(
                        'Month',
                        this
                    )
                ">

                Month

            </button>


            <button
                class="filter-btn"
                onclick="
                    changeExpensePeriod(
                        'Year',
                        this
                    )
                ">

                Year

            </button>

        </div>



        <!-- EXPENSE SUMMARY -->

        <div class="expense-summary">


            <div class="summary-box">

                <span>
                    Fuel
                </span>

                <strong id="fuelTotal">
                    ₹0
                </strong>

            </div>


            <div class="summary-box">

                <span>
                    Toll
                </span>

                <strong id="tollTotal">
                    ₹0
                </strong>

            </div>


            <div class="summary-box">

                <span>
                    Maintenance
                </span>

                <strong id="maintenanceTotal">
                    ₹0
                </strong>

            </div>


            <div class="summary-box">

                <span>
                    Other
                </span>

                <strong id="otherTotal">
                    ₹0
                </strong>

            </div>


        </div>



        <!-- ADD EXPENSE -->

        <button
            class="add-expense-btn"
            onclick="openExpenseModal()">

            ➕ Add New Expense

        </button>



        <!-- EXPENSE LIST -->

        <div class="section-heading">

            <strong>
                Expense History
            </strong>

            <button
                onclick="loadExpenses()">

                ↻ Refresh

            </button>

        </div>


        <div
            id="expenseList"
            class="expense-list">

            <div class="empty-state">

                <div class="empty-icon">
                    🧾
                </div>

                <strong>
                    No Expenses
                </strong>

                <small>
                    Aapke expenses yahan show honge.
                </small>

            </div>

        </div>


    </section>

</main>



<!-- =====================================
     ADD EXPENSE MODAL
===================================== -->

<div
    id="expenseModal"
    class="modal">

    <div class="modal-box">


        <div class="modal-header">

            <strong>
                Add Expense
            </strong>

            <button
                onclick="closeExpenseModal()">

                ×

            </button>

        </div>


        <label>
            Expense Category
        </label>

        <select
            id="expenseCategory">

            <option value="">
                Select Category
            </option>

            <option value="Fuel">
                ⛽ Fuel
            </option>

            <option value="Toll">
                🛣️ Toll
            </option>

            <option value="Maintenance">
                🔧 Maintenance
            </option>

            <option value="Driver">
                👨‍✈️ Driver
            </option>

            <option value="Food">
                🍱 Food
            </option>

            <option value="Other">
                📦 Other
            </option>

        </select>


        <label>
            Amount
        </label>

        <input
            type="number"
            id="expenseAmount"
            placeholder="Enter amount"
            min="1">


        <label>
            Description
        </label>

        <input
            type="text"
            id="expenseDescription"
            placeholder="e.g. Diesel for truck">


        <button
            class="modal-primary"
            onclick="saveExpense()">

            Save Expense

        </button>


        <button
            class="modal-secondary"
            onclick="closeExpenseModal()">

            Cancel

        </button>


    </div>

</div>



<!-- =====================================
     JAVASCRIPT
===================================== -->

<script>

/* =====================================
   EXPENSES - JAVASCRIPT PART 3
===================================== */

const EXPENSE_KEY = "tp_expenses";

let selectedExpensePeriod = "Today";


/* =====================================
   STORAGE
===================================== */

function getExpenses(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    EXPENSE_KEY
                ) || "[]"
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        console.log(error);

        return [];

    }

}


function saveExpenses(data){

    localStorage.setItem(
        EXPENSE_KEY,
        JSON.stringify(data)
    );

}


/* =====================================
   PERIOD FILTER
===================================== */

function changeExpensePeriod(
    period,
    button
){

    selectedExpensePeriod =
        period;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    document.getElementById(
        "expensePeriod"
    ).innerText =
        period;


    updateExpenseDashboard();

}


/* =====================================
   CHECK DATE
===================================== */

function isExpenseInPeriod(
    dateString
){

    const date =
        new Date(
            dateString
        );

    const now =
        new Date();


    if(selectedExpensePeriod === "Today"){

        return (
            date.getDate() ===
            now.getDate()
            &&
            date.getMonth() ===
            now.getMonth()
            &&
            date.getFullYear() ===
            now.getFullYear()
        );

    }


    if(selectedExpensePeriod === "Week"){

        const start =
            new Date(now);

        start.setDate(
            now.getDate() - 6
        );

        start.setHours(
            0,0,0,0
        );


        return date >= start;

    }


    if(selectedExpensePeriod === "Month"){

        return (
            date.getMonth() ===
            now.getMonth()
            &&
            date.getFullYear() ===
            now.getFullYear()
        );

    }


    if(selectedExpensePeriod === "Year"){

        return (
            date.getFullYear() ===
            now.getFullYear()
        );

    }


    return true;

}


/* =====================================
   OPEN MODAL
===================================== */

function openExpenseModal(){

    document.getElementById(
        "expenseModal"
    ).classList.add(
        "show"
    );

}


/* =====================================
   CLOSE MODAL
===================================== */

function closeExpenseModal(){

    document.getElementById(
        "expenseModal"
    ).classList.remove(
        "show"
    );

}


/* =====================================
   SAVE EXPENSE
===================================== */

function saveExpense(){

    const category =
        document.getElementById(
            "expenseCategory"
        ).value;


    const amount =
        Number(
            document.getElementById(
                "expenseAmount"
            ).value
        );


    const description =
        document.getElementById(
            "expenseDescription"
        ).value.trim();


    if(!category){

        alert(
            "⚠️ Expense category select karein."
        );

        return;

    }


    if(!amount || amount <= 0){

        alert(
            "⚠️ Valid amount enter karein."
        );

        return;

    }


    const expense = {

        id:
            "EXP-" +
            Date.now()
                .toString()
                .slice(-8),

        category:
            category,

        amount:
            amount,

        description:
            description || "No description",

        date:
            new Date().toISOString()

    };


    const expenses =
        getExpenses();


    expenses.unshift(
        expense
    );


    saveExpenses(
        expenses
    );


    document.getElementById(
        "expenseCategory"
    ).value = "";


    document.getElementById(
        "expenseAmount"
    ).value = "";


    document.getElementById(
        "expenseDescription"
    ).value = "";


    closeExpenseModal();


    updateExpenseDashboard();


    alert(
        "✅ Expense successfully added."
    );

}


/* =====================================
   UPDATE DASHBOARD
===================================== */

function updateExpenseDashboard(){

    const expenses =
        getExpenses()
        .filter(
            expense =>
                isExpenseInPeriod(
                    expense.date
                )
        );


    let total = 0;
    let fuel = 0;
    let toll = 0;
    let maintenance = 0;
    let other = 0;


    expenses.forEach(
        expense => {

            const amount =
                Number(
                    expense.amount || 0
                );


            total += amount;


            if(
                expense.category ===
                "Fuel"
            ){

                fuel += amount;

            }
            else if(
                expense.category ===
                "Toll"
            ){

                toll += amount;

            }
            else if(
                expense.category ===
                "Maintenance"
            ){

                maintenance += amount;

            }
            else{

                other += amount;

            }

        }
    );


    document.getElementById(
        "totalExpenses"
    ).innerText =
        "₹" +
        total.toLocaleString(
            "en-IN"
        );


    document.getElementById(
        "fuelTotal"
    ).innerText =
        "₹" +
        fuel.toLocaleString(
            "en-IN"
        );


    document.getElementById(
        "tollTotal"
    ).innerText =
        "₹" +
        toll.toLocaleString(
            "en-IN"
        );


    document.getElementById(
        "maintenanceTotal"
    ).innerText =
        "₹" +
        maintenance.toLocaleString(
            "en-IN"
        );


    document.getElementById(
        "otherTotal"
    ).innerText =
        "₹" +
        other.toLocaleString(
            "en-IN"
        );


    loadExpenses();

}


/* =====================================
   LOAD EXPENSES
===================================== */

function loadExpenses(){

    const container =
        document.getElementById(
            "expenseList"
        );


    if(!container){
        return;
    }


    const expenses =
        getExpenses()
        .filter(
            expense =>
                isExpenseInPeriod(
                    expense.date
                )
        );


    if(expenses.length === 0){

        container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    🧾
                </div>

                <strong>
                    No Expenses
                </strong>

                <small>
                    ${selectedExpensePeriod}
                    ke expenses yahan show honge.
                </small>

            </div>

        `;

        return;

    }


    container.innerHTML =
        expenses
        .map(
            expense => `

                <div
                    class="expense-item"
                >

                    <div
                        class="expense-icon"
                    >
                        ${getCategoryIcon(
                            expense.category
                        )}
                    </div>


                    <div
                        class="expense-info"
                    >

                        <strong>
                            ${escapeHTML(
                                expense.category
                            )}
                        </strong>

                        <small>
                            ${escapeHTML(
                                expense.description
                            )}
                        </small>

                        <small>
                            ${formatDate(
                                expense.date
                            )}
                        </small>

                    </div>


                    <div
                        class="expense-amount"
                    >

                        <strong>
                            - ₹${Number(
                                expense.amount
                            ).toLocaleString(
                                "en-IN"
                            )}
                        </strong>

                        <small>
                            ${escapeHTML(
                                expense.id
                            )}
                        </small>

                    </div>


                    <button
                        onclick="
                            deleteExpense(
                                '${expense.id}'
                            )
                        "
                        style="
                            border:0;
                            background:#fff1f0;
                            color:#d92d20;
                            width:28px;
                            height:28px;
                            border-radius:7px;
                            cursor:pointer;
                            font-size:12px;
                        "
                    >
                        🗑
                    </button>

                </div>

            `
        )
        .join("");

}


/* =====================================
   DELETE EXPENSE
===================================== */

function deleteExpense(id){

    const confirmed =
        confirm(
            "Kya aap ye expense delete karna chahte hain?"
        );


    if(!confirmed){
        return;
    }


    const expenses =
        getExpenses();


    const updated =
        expenses.filter(
            expense =>
                expense.id !== id
        );


    saveExpenses(
        updated
    );


    updateExpenseDashboard();


    alert(
        "✅ Expense deleted."
    );

}

/* =====================================
   FORMAT DATE
===================================== */

function formatDate(
    dateString
){

    return new Date(
        dateString
    ).toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================
   BACK
===================================== */

function goBack(){

    if(
        document.referrer &&
        document.referrer !==
        window.location.href
    ){

        history.back();

    }
    else{

        window.location.href =
            "earnings.html";

    }

}
