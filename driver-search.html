<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Driver Search - TransportPro</title>

<style>

/* =====================================
   RESET
===================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fb;
    color:#172033;
    min-height:100vh;
}


/* =====================================
   HEADER
===================================== */

.top-header{
    width:100%;
    height:62px;

    background:#101820;
    color:#fff;

    display:flex;
    align-items:center;

    gap:12px;
    padding:0 14px;

    position:sticky;
    top:0;
    z-index:100;
}

.back-btn,
.notification-btn{
    width:38px;
    height:38px;

    border:0;
    border-radius:8px;

    background:transparent;
    color:#fff;

    font-size:24px;
    cursor:pointer;
}

.back-btn:active,
.notification-btn:active{
    background:#26313d;
}

.logo{
    width:38px;
    height:38px;

    border-radius:9px;

    background:#fff;
    color:#1769e0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:15px;
    font-weight:900;
}

.brand{
    flex:1;

    display:flex;
    flex-direction:column;
}

.brand strong{
    font-size:15px;
}

.brand small{
    color:#cbd5e1;
    font-size:9px;
}


/* =====================================
   MAIN
===================================== */

.container{
    width:100%;
    max-width:850px;

    margin:auto;
    padding:15px;
}

.dashboard-btn{
    background:#fff;
    color:#172033;

    border:1px solid #dbe2ea;

    padding:10px 13px;

    border-radius:9px;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;

    margin-bottom:12px;
}

.dashboard-btn:active{
    transform:scale(.98);
}


/* =====================================
   MAIN CARD
===================================== */

.search-card{
    background:#fff;

    border:1px solid #e2e8f0;

    border-radius:15px;

    padding:17px;

    box-shadow:
        0 4px 15px rgba(16,24,40,.05);
}


/* =====================================
   PAGE HEADING
===================================== */

.page-heading{
    display:flex;
    align-items:center;

    gap:13px;

    padding-bottom:17px;
}

.page-icon{
    width:58px;
    height:58px;

    border-radius:14px;

    background:#eef5ff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:31px;

    flex-shrink:0;
}

.page-heading h1{
    font-size:21px;

    margin-bottom:5px;
}

.page-heading p{
    color:#667085;

    font-size:11px;

    line-height:17px;
}


/* =====================================
   MAIN SEARCH
===================================== */

.main-search{
    display:flex;

    width:100%;

    margin-bottom:12px;
}

.main-search input{
    flex:1;

    height:46px;

    border:1px solid #d7dee8;

    border-right:0;

    border-radius:9px 0 0 9px;

    padding:0 13px;

    font-size:11px;

    color:#172033;

    outline:none;
}

.main-search input:focus{
    border-color:#1769e0;
}

.main-search button{
    min-width:105px;

    height:46px;

    border:1px solid #1769e0;

    background:#1769e0;

    color:#fff;

    border-radius:0 9px 9px 0;

    font-size:10px;

    font-weight:bold;

    cursor:pointer;
}

.main-search button:active{
    transform:scale(.98);
}


/* =====================================
   FILTERS
===================================== */

.filters{
    display:flex;

    gap:7px;

    overflow-x:auto;

    padding-bottom:5px;

    margin-bottom:15px;

    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter-btn{
    flex-shrink:0;

    height:34px;

    padding:0 12px;

    border:1px solid #dbe2ea;

    border-radius:20px;

    background:#fff;

    color:#475467;

    font-size:9px;

    font-weight:bold;

    cursor:pointer;
}

.filter-btn.active{
    background:#1769e0;

    border-color:#1769e0;

    color:#fff;
}

.filter-btn:active{
    transform:scale(.97);
}


/* =====================================
   RESULT HEADER
===================================== */

.result-header{
    display:flex;

    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid #edf0f4;

    padding-bottom:10px;

    margin-bottom:10px;
}

.result-header strong{
    font-size:13px;
}

.result-header span{
    color:#667085;

    font-size:9px;
}


/* =====================================
   SEARCH RESULTS
===================================== */

.search-results{
    display:flex;

    flex-direction:column;

    gap:10px;
}


/* =====================================
   DRIVER RESULT CARD
===================================== */

.driver-result{
    border:1px solid #e2e8f0;

    border-radius:11px;

    padding:12px;

    background:#fff;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.driver-result:active{
    transform:scale(.99);
}

.driver-result-top{
    display:flex;

    align-items:flex-start;

    gap:10px;

    margin-bottom:10px;
}

.driver-avatar{
    width:48px;
    height:48px;

    border-radius:50%;

    background:#eef5ff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;

    flex-shrink:0;
}

.driver-title{
    flex:1;

    min-width:0;
}

.driver-title strong{
    display:block;

    font-size:12px;

    margin-bottom:4px;
}

.driver-title small{
    display:block;

    color:#667085;

    font-size:8px;

    line-height:14px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =====================================
   STATUS
===================================== */

.driver-status{
    padding:5px 8px;

    border-radius:20px;

    font-size:8px;

    font-weight:bold;

    white-space:nowrap;
}

.status-active{
    background:#eaf8ef;
    color:#137333;
}

.status-available{
    background:#eef5ff;
    color:#1769e0;
}

.status-trip{
    background:#fff5df;
    color:#a15c00;
}

.status-inactive{
    background:#fff0f0;
    color:#c62828;
}


/* =====================================
   DRIVER INFO
===================================== */

.driver-info{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    margin-bottom:10px;
}

.info-box{
    border:1px solid #edf0f4;

    border-radius:7px;

    padding:8px 5px;

    text-align:center;
}

.info-box span{
    display:block;

    color:#98a2b3;

    font-size:7px;

    margin-bottom:4px;
}

.info-box strong{
    display:block;

    font-size:9px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =====================================
   ACTIONS
===================================== */

.driver-actions{
    display:flex;

    gap:7px;
}

.driver-actions button{
    flex:1;

    height:34px;

    border-radius:7px;

    font-size:9px;

    font-weight:bold;

    cursor:pointer;
}

.view-btn{
    background:#1769e0;

    color:#fff;

    border:0;
}

.call-btn{
    background:#eaf8ef;

    color:#137333;

    border:1px solid #b8dfc5;
}

.message-btn{
    background:#fff;

    color:#1769e0;

    border:1px solid #1769e0;
}


/* =====================================
   EMPTY STATE
===================================== */

.empty-state{
    text-align:center;

    padding:38px 12px;

    border:1px dashed #d7dee8;

    border-radius:11px;
}

.empty-icon{
    font-size:32px;

    margin-bottom:8px;
}

.empty-state strong{
    display:block;

    font-size:12px;

    margin-bottom:5px;
}

.empty-state small{
    display:block;

    color:#667085;

    font-size:9px;

    line-height:15px;
}


/* =====================================
   MOBILE
===================================== */

@media(max-width:450px){

    .container{
        padding:10px;
    }

    .search-card{
        padding:12px;
    }

    .page-heading{
        align-items:flex-start;
    }

    .page-icon{
        width:50px;
        height:50px;

        font-size:27px;
    }

    .page-heading h1{
        font-size:18px;
    }

    .page-heading p{
        font-size:10px;
    }

    .main-search input{
        min-width:0;
    }

    .main-search button{
        min-width:88px;
    }

    .driver-result-top{
        flex-wrap:wrap;
    }

    .driver-title{
        min-width:
            calc(100% - 58px);
    }

    .driver-status{
        margin-left:58px;
    }

    .driver-info{
        grid-template-columns:
            repeat(2,1fr);
    }

}


/* =====================================
   VERY SMALL MOBILE
===================================== */

@media(max-width:340px){

    .search-card{
        padding:10px;
    }

    .main-search button{
        min-width:75px;

        font-size:8px;
    }

    .driver-actions button{
        font-size:8px;
    }

}

</style>

</head>

<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="top-header">

    <button
        class="back-btn"
        onclick="goBack()">

        ←

    </button>


    <div class="logo">
        TP
    </div>


    <div class="brand">

        <strong>
            TransportPro
        </strong>

        <small>
            Driver Search
        </small>

    </div>


    <button
        class="notification-btn"
        onclick="openNotifications()">

        🔔

    </button>

</header>



<!-- =====================================
     MAIN
===================================== -->

<main class="container">


    <button
        class="dashboard-btn"
        onclick="goBack()">

        ← Back

    </button>


    <section class="search-card">


        <!-- PAGE HEADING -->

        <div class="page-heading">

            <div class="page-icon">
                🔍
            </div>

            <div>

                <h1>
                    Driver Search
                </h1>

                <p>
                    Driver name, phone, ID ya
                    license se search karein.
                </p>

            </div>

        </div>



        <!-- SEARCH FORM -->

        <div class="main-search">

            <input
                type="search"
                id="driverSearchInput"
                placeholder="Search driver..."
                autocomplete="off">

            <button
                onclick="searchDrivers()">

                🔍 Search

            </button>

        </div>



        <!-- FILTERS -->

        <div class="filters">

            <button
                class="filter-btn active"
                onclick="filterDrivers('All',this)">

                All

            </button>

            <button
                class="filter-btn"
                onclick="filterDrivers('Active',this)">

                Active

            </button>

            <button
                class="filter-btn"
                onclick="filterDrivers('Available',this)">

                Available

            </button>

            <button
                class="filter-btn"
                onclick="filterDrivers('On Trip',this)">

                On Trip

            </button>

            <button
                class="filter-btn"
                onclick="filterDrivers('Inactive',this)">

                Inactive

            </button>

        </div>



        <!-- SEARCH RESULT COUNT -->

        <div class="result-header">

            <strong>
                Drivers
            </strong>

            <span id="resultCount">
                0 results
            </span>

        </div>



        <!-- DRIVER RESULTS -->

        <div
            id="searchResults"
            class="search-results">

            <div class="empty-state">

                <div class="empty-icon">
                    🔍
                </div>

                <strong>
                    Search for a Driver
                </strong>

                <small>
                    Upar search box mein driver
                    ka naam, phone, ID ya license enter karein.
                </small>

            </div>

        </div>


    </section>


</main>



<!-- =====================================
     JAVASCRIPT
===================================== -->

<script>

/* =====================================
   DRIVER SEARCH - JAVASCRIPT
===================================== */

const DRIVER_KEY = "tp_drivers";

let currentFilter = "All";


/* =====================================
   GET DRIVERS
===================================== */

function getDrivers(){

    const saved =
        localStorage.getItem(DRIVER_KEY);

    if(!saved){
        return [];
    }

    try{

        const data = JSON.parse(saved);

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        console.log(error);

        return [];

    }

}


/* =====================================
   SEARCH DRIVERS
===================================== */

function searchDrivers(){

    const input =
        document.getElementById(
            "driverSearchInput"
        );

    const query =
        input.value
        .trim()
        .toLowerCase();


    const drivers =
        getDrivers();


    let results =
        drivers.filter(driver => {

            const matchesSearch =
                query === "" ||

                String(driver.name)
                    .toLowerCase()
                    .includes(query) ||

                String(driver.phone)
                    .toLowerCase()
                    .includes(query) ||

                String(driver.id)
                    .toLowerCase()
                    .includes(query) ||

                String(driver.license)
                    .toLowerCase()
                    .includes(query);


            const matchesFilter =
                currentFilter === "All" ||
                driver.status === currentFilter;


            return (
                matchesSearch &&
                matchesFilter
            );

        });


    displayResults(results);

}


/* =====================================
   FILTER DRIVERS
===================================== */

function filterDrivers(
    filter,
    button
){

    currentFilter = filter;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    searchDrivers();

}


/* =====================================
   DISPLAY RESULTS
===================================== */

function displayResults(drivers){

    const container =
        document.getElementById(
            "searchResults"
        );


    const count =
        document.getElementById(
            "resultCount"
        );


    count.innerText =
        drivers.length +
        (
            drivers.length === 1
            ? " result"
            : " results"
        );


    if(drivers.length === 0){

        container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    🔍
                </div>

                <strong>
                    No Driver Found
                </strong>

                <small>
                    Search keyword ya filter
                    change karke dobara try karein.
                </small>

            </div>

        `;

        return;

    }


    container.innerHTML =
        drivers
        .map(driver => {

            let statusClass =
                "status-active";


            if(
                driver.status ===
                "Available"
            ){

                statusClass =
                    "status-available";

            }
            else if(
                driver.status ===
                "On Trip"
            ){

                statusClass =
                    "status-trip";

            }
            else if(
                driver.status ===
                "Inactive"
            ){

                statusClass =
                    "status-inactive";

            }


            return `

                <div
                    class="driver-result"
                >

                    <div
                        class="driver-result-top"
                    >


                        <div class="driver-avatar">
                            👨‍✈️
                        </div>


                        <div class="driver-title">

                            <strong>
                                ${escapeHTML(
                                    driver.name
                                )}
                            </strong>

                            <small>
                                ID:
                                ${escapeHTML(
                                    driver.id
                                )}
                            </small>

                            <small>
                                📞
                                ${escapeHTML(
                                    driver.phone
                                )}
                            </small>

                        </div>


                        <span
                            class="
                                driver-status
                                ${statusClass}
                            "
                        >

                            ${escapeHTML(
                                driver.status
                            )}

                        </span>


                    </div>


                    <div class="driver-info">


                        <div class="info-box">

                            <span>
                                License
                            </span>

                            <strong>
                                ${escapeHTML(
                                    driver.license ||
                                    "-"
                                )}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Experience
                            </span>

                            <strong>
                                ${escapeHTML(
                                    driver.experience ||
                                    0
                                )}
                                yrs
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Rating
                            </span>

                            <strong>
                                ⭐
                                ${escapeHTML(
                                    driver.rating ||
                                    "5.0"
                                )}
                            </strong>

                        </div>


                    </div>


                    <div class="driver-actions">


                        <button
                            class="view-btn"
                            onclick="
                                viewDriver(
                                    '${driver.id}'
                                )
                            "
                        >

                            👁 View

                        </button>


                        <button
                            class="call-btn"
                            onclick="
                                callDriver(
                                    '${driver.phone}'
                                )
                            "
                        >

                            📞 Call

                        </button>


                        <button
                            class="message-btn"
                            onclick="
                                messageDriver(
                                    '${driver.phone}'
                                )
                            "
                        >

                            💬 Message

                        </button>


                    </div>


                </div>

            `;

        })
        .join("");

}


/* =====================================
   VIEW DRIVER
===================================== */

function viewDriver(id){

    const drivers =
        getDrivers();


    const driver =
        drivers.find(
            item =>
                item.id === id
        );


    if(!driver){

        alert(
            "⚠️ Driver nahi mila."
        );

        return;

    }


    alert(

        "👨‍✈️ DRIVER DETAILS\n\n" +

        "Name: " +
        driver.name +

        "\n\nDriver ID: " +
        driver.id +

        "\n\nMobile: " +
        driver.phone +

        "\n\nLicense: " +
        (
            driver.license ||
            "-"
        ) +

        "\n\nExperience: " +
        (
            driver.experience ||
            0
        ) +
        " years" +

        "\n\nStatus: " +
        driver.status +

        "\n\nRating: ⭐ " +
        (
            driver.rating ||
            "5.0"
        )

    );

}


/* =====================================
   CALL DRIVER
===================================== */

function callDriver(phone){

    if(!phone){

        alert(
            "⚠️ Driver ka mobile number available nahi hai."
        );

        return;

    }


    const confirmed =
        confirm(
            "📞 Driver ko call karna hai?"
        );


    if(!confirmed){
        return;
    }


    window.location.href =
        "tel:" +
        phone;

}


/* =====================================
   MESSAGE DRIVER
===================================== */

function messageDriver(phone){

    if(!phone){

        alert(
            "⚠️ Driver ka mobile number available nahi hai."
        );

        return;

    }


    const confirmed =
        confirm(
            "💬 Driver ko message bhejna hai?"
        );


    if(!confirmed){
        return;
    }


    window.location.href =
        "sms:" +
        phone;

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================
   BACK
===================================== */

function goBack(){

    if(
        document.referrer &&
        document.referrer !==
        window.location.href
    ){

        history.back();

    }
    else{

        window.location.href =
            "my-drivers.html";

    }

}


/* =====================================
   NOTIFICATIONS
===================================== */

function openNotifications(){

    window.location.href =
        "notifications.html";

}


/* =====================================
   ENTER KEY SEARCH
===================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const input =
            document.getElementById(
                "driverSearchInput"
            );


        if(input){

            input.addEventListener(
                "keydown",
                function(event){

                    if(
                        event.key ===
                        "Enter"
                    ){

                        searchDrivers();

                    }

                }
            );

        }


        /*
         * Page open hote hi
         * saare drivers show honge.
         */

        searchDrivers();

    }
);

</script>


</body>

</html>
